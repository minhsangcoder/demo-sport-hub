  "components": {
    "securitySchemes": {
      "bearerAuth": {
        "type": "http",
        "scheme": "bearer",
        "bearerFormat": "JWT"
      }
    },
    "schemas": {
      "Venue": {
        "type": "object",
        "properties": {
          "facilityName": {
            "type": "string"
          },
          "courtName": {
            "type": "string"
          },
          "sportCategoryId": {
            "type": "string",
            "format": "uuid"
          },
          "address": {
            "type": "string",
            "description": "House number, street and additional address details from the facility."
          },
          "provinceCode": {
            "type": "string",
            "minLength": 2,
            "maxLength": 2,
            "pattern": "^[0-9]{2}$",
            "description": "Current administrative code on newly created snapshots; absent on retained legacy snapshots, or null for an unmapped legacy facility.",
            "nullable": true
          },
          "province": {
            "type": "string",
            "description": "Province/city display name."
          },
          "wardCode": {
            "type": "string",
            "minLength": 5,
            "maxLength": 5,
            "pattern": "^[0-9]{5}$",
            "description": "Current administrative code on newly created snapshots; absent on retained legacy snapshots, or null for an unmapped legacy facility.",
            "nullable": true
          },
          "ward": {
            "type": "string",
            "description": "Commune/ward display name on current two-level address snapshots."
          },
          "timezone": {
            "type": "string"
          },
          "amenities": {
            "type": "array",
            "items": {
              "type": "string"
            }
          }
        },
        "required": [
          "facilityName",
          "courtName",
          "sportCategoryId",
          "address",
          "province",
          "timezone",
          "amenities"
        ],
        "description": "New venue snapshots include province/city and commune/ward codes and display names. Historical immutable snapshots may omit the current administrative codes and commune/ward field."
      },
      "Listing": {
        "type": "object",
        "properties": {
          "id": {
            "type": "string",
            "format": "uuid"
          },
          "facilityId": {
            "type": "string",
            "format": "uuid"
          },
          "courtId": {
            "type": "string",
            "format": "uuid"
          },
          "venue": {
            "$ref": "#/components/schemas/Venue"
          },
          "originalAmount": {
            "type": "number",
            "minimum": 0,
            "exclusiveMinimum": true
          },
          "price": {
            "type": "number",
            "minimum": 0,
            "exclusiveMinimum": true
